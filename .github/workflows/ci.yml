# The whole point of this file is that verification stops depending on someone
# remembering to run it. Typecheck, tests, and a production build run on every
# push and pull request; a change that breaks any of the three cannot be merged
# quietly.
#
# Bun is used rather than npm because the repo ships bun.lock and the test
# script calls `bunx tsx`. Installing with npm here would ignore the lockfile
# and produce a different dependency tree than the one the tests were written
# against — the classic "works locally, fails in CI" in reverse.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same branch makes older runs pointless, so cancel them
  # rather than queueing. The group is per-ref so two branches never cancel
  # each other.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Installs exactly what bun.lock specifies. `--frozen-lockfile` makes a
      # out-of-date lockfile a hard failure instead of a silent upgrade, which
      # is the difference between "the build broke" and "the build broke for
      # reasons nobody can see in this diff".
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      # A build catches what typecheck cannot: a bad import path, a route that
      # breaks static generation, a client component that reaches for `window`
      # during prerender. No environment variables are set here on purpose —
      # Openmi must build with nothing configured, and a build that silently
      # depended on a secret would be a deployment waiting to fail.
      - name: Production build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.invalid

  # The migration folder is part of the product: a file that cannot be applied
  # a second time stops `supabase db push` at that file, and every migration
  # after it never runs. That is how a table can be missing while its own
  # migration file is correct. This job applies the whole set twice to a
  # throwaway Postgres and checks the objects the routes need, so drift fails a
  # pull request instead of a deployment.
  #
  # It is a separate job rather than a step in `verify` so the failed check has
  # its own name in the PR list — "Migrations apply twice" says what broke
  # without opening the log.
  migrations:
    name: Migrations apply twice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # PGlite is Postgres compiled to WebAssembly, so this needs no service
      # container and no Docker: the engine parsing the SQL is the real one.
      # See `scripts/check-migrations.mjs` for the two passes and the assertions.
      - name: Apply every migration twice
        run: bun run check:migrations
